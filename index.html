<!DOCTYPE html>
<html>

    <head>
        <title>My To-Do List</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        
        <header>
            <h1>My To-Do List</h1>
            <p>Add your tasks below.</p>
            <p>
                <strong>Remember:</strong> Complete your tasks before the end of the day.
            </p>
        </header>

        <main>

            <section>
                <h2>Tasks</h2>
                    
                <form>
                    <label for="taskInput">Task:</label>
                    <input type="text" id="taskInput">

                    <button>Add Tasks</button>
                </form>

                <!-- This is the task list -->
                <ul></ul>

            </section>

        </main>

        <footer>
            <p>My To-Do List App</p>
        </footer>
    
        <script src="script.js"></script>
    </body>
</html>
