<!DOCTYPE html>
<html>

    <head>
        <title>My To-Do List</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        
        <header>
            <h1>My To-Do List</h1>
            <p>Add your tasks below.</p>
            <p>
                <strong>Remember:</strong> Complete your tasks before the end of the day.
            </p>
        </header>

        <main>

            <section>
                <h2>Tasks</h2>
                    
                <form>
                    <label for="taskInput">Task:</label>
                    <input type="text" id="taskInput">

                    <button>Add Tasks</button>
                </form>

                <ul>
                    <li class="task">
                        <input type="checkbox" class="task-checkbox">
                        <span>Study for Calc</span>
                        <button>Delete</button>
                    </li>
                    <li class="task">Finish homework</li>
                    <li class="task">Practice Japanese</li>
                </ul>

            </section>

        </main>

        <footer>
            <p>My To-Do List App</p>
        </footer>

    </body>
</html>
