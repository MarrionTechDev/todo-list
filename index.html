<!DOCTYPE html>
<html>

    <head>
        <title>My To-Do List</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        
        <header>
            <h1>📝My To-Do List</h1>
            <p>
                <strong>Remember:</strong> Complete your tasks before the end of the day.
            </p>
        </header>

        <main>

            <section>
                <h2>My Tasks</h2>
                    
                <form>
                    <input type="text" id="taskInput" placeholder="Enter a new task">

                    <button class="add-button">Add Tasks</button>
                </form>

                <div class="task-summary">
                    <p id="taskCount">Tasks: 0</p>

                    <button id="clearTasks">Clear All</button>
                </div>

                <!-- This is the task list -->
                <ul></ul>

            </section>

        </main>

        <footer>
            <p>My To-Do List App</p>
        </footer>
    
        <script src="script.js"></script>
    </body>
</html>
